 yesTZcz.1001.name: "亚空间回声"
 yesTZcz.1001.desc: "星系际空间探测到的亚空间回声现已接近我们的星系外缘。回声主体即将到来，指向许多的边缘恒星系。\n我们已经把这些星系坐标输入状态日志并将持续监控情况发展。"
 yesTZcz.1001.a: "§R它们来了......§!"

 yesTZcz.1003.name: "第二入侵点"
 yesTZcz.1003.desc: "在[yesTZ_cz_1_system.GetName]星系同样检测到了亚空间回声，它们的入侵不止一处。"
 yesTZcz.1003.a: "全军进入戒备状态。"

