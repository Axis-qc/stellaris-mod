l_simp_chinese:
 edict_laopo: "§H召唤灰风§!"
 edict_laopo_desc: "直接召唤灰风，只能使用一次,仅限单人模式可用。"

 planet_pop_speed_add: "星球承载力"
 planet_pop_speed_add_desc: "星球空余住房越多，人口增长越快。\n星球住房拥挤将会导致人口增长速度降低。"
 planet_pop_speed_add_1: "星球承载力"
 planet_pop_speed_add_1_desc: "星球空余住房越多，人口增长越快。\n星球住房拥挤将会导致人口增长速度降低。"
 planet_pop_speed_die: "过度拥挤"
 planet_pop_speed_die_desc: "这个星球太过拥挤了，不足以支持这么多人口,当住房-50k以上后每个月会损失10%人口。"

 planet_ck103.title: "是否启用星球承载力"
 planet_ck103.desc: "星球所能容纳的人口数量将与§Y星球住房数量§!有关，住房丰富将提供人口增速加成，反之将会降低人口增速。"
 planet_ck103.1: "关闭"
 planet_ck103.2: "启用"

 planet_ck104.title: "是否开启战争保护"
 planet_ck104.desc: "开启将会增加一个用于直接结束战争的法令，当你被攻击时可以直接停止战争（法令存在40年）"
 planet_ck104.1: "打开"
 planet_ck104.2: "关闭"

 edict_play_war: "§H强制停战§!"
 edict_play_war_desc: "直接停止战争"

 planet_ck105.title: "战争保护"
 planet_ck105.desc: "我方为§Y[war_1.GetName]§!\n对方为§Y[war_2.GetName]§!"
 planet_ck105.1: "收为附属上供"
 planet_ck105.2: "直接消灭"

 edict_play_kill_ai: "§R清除ai帝国§!"
 edict_play_kill_ai_desc: "一键清除普通ai帝国，不包括失落帝国，天灾等\n如果后期太卡可用来解放cpu"

 edict_play_kill_player: "§R跳车§!"
 edict_play_kill_player_desc: "§R摧毁当前帝国§!"

 play_wx_add: "§H无限掌控§!"
 play_wx_add_desc: "我们的文明需要更多空间繁衍生息，所以我们就得创造空间。决不能让大自然阻挡我们的进步之路。"
 planet_qh_add: "无限掌控"
 planet_qh_add_value: "无限掌控"

 edict_play_starbase_up: "手动激活升级"
