 BR_LEVEL_STATUS_1_DESC: "§Y当前等级：§G1级§!  战斗评分：§G[Root.br_combat_score] / 80§!\n已解锁：§B护卫舰§!\n────────────────────\n§Y下一等级：§G2级§!（评分 ≥ 80）\n2级解锁：§B雷击舰§!、§B核心流派选择§!（舰载机/导弹/激光/动能/防御）\n\n['concept_br_level_rules_1', §Y等级规则§!]"
 BR_LEVEL_STATUS_2_DESC: "§Y当前等级：§G2级§!  战斗评分：§G[Root.br_combat_score] / 250§!\n已解锁：§B护卫舰 雷击舰§!  §W奖励45%通用+55%流派§!\n────────────────────\n§Y下一等级：§G3级§!（评分 ≥ 250）\n3级解锁：§B驱逐舰§!\n\n['concept_br_level_rules_2', §Y等级规则§!]"
 BR_LEVEL_STATUS_3_DESC: "§Y当前等级：§G3级§!  战斗评分：§G[Root.br_combat_score] / 550§!\n已解锁：§B护卫舰 雷击舰 驱逐舰§!\n────────────────────\n§Y下一等级：§G4级§!（评分 ≥ 550）\n4级解锁：§B巡洋舰§!  升级奖励可获更高级作战电脑和反应堆\n\n['concept_br_level_rules_3', §Y等级规则§!]"
 BR_LEVEL_STATUS_4_DESC: "§Y当前等级：§G4级§!  战斗评分：§G[Root.br_combat_score] / 1000§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰§!\n────────────────────\n§Y下一等级：§G5级§!（评分 ≥ 1000）\n5级解锁：§B战列舰§! §B高级特殊奖励§!（资源换舰船/强科技/强BUFF）\n\n['concept_br_level_rules_4', §Y等级规则§!]"
 BR_LEVEL_STATUS_5_DESC: "§Y当前等级：§G5级§!  战斗评分：§G[Root.br_combat_score] / 1700§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰 战列舰§!\n────────────────────\n§Y下一等级：§G6级§!（评分 ≥ 1700）\n6级解锁：§B泰坦§!  升级奖励25%混入高级特殊事件\n\n['concept_br_level_rules_5', §Y等级规则§!]"
 BR_LEVEL_STATUS_6_DESC: "§Y当前等级：§G6级§!  战斗评分：§G[Root.br_combat_score] / 2700§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰 战列舰 泰坦§!\n────────────────────\n§Y下一等级：§G7级§!（评分 ≥ 2700）\n7级解锁：§B主宰级母舰§!\n\n['concept_br_level_rules_6', §Y等级规则§!]"
 BR_LEVEL_STATUS_7_DESC: "§Y当前等级：§G7级§!  战斗评分：§G[Root.br_combat_score] / 4500§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰 战列舰 泰坦 主宰§!\n────────────────────\n§Y下一等级：§G8级§!（评分 ≥ 4500）\n8级解锁：§BPVE Boss触发§!  高级特殊奖励深化\n\n['concept_br_level_rules_7', §Y等级规则§!]"
 BR_LEVEL_STATUS_8_DESC: "§Y当前等级：§G8级§!  战斗评分：§G[Root.br_combat_score] / 7000§!\n已解锁：§B全部舰船§!\n────────────────────\n§Y下一等级：§G9级§!（评分 ≥ 7000）\n\n['concept_br_level_rules_8', §Y等级规则§!]"
