 BR_PVE_BOSS: "虚空之主"
 BR_PVE_BOSS_DESC: "从星系中心裂痕中涌出的远古虚空实体，正在吞噬整个星系。"
 br_pve_boss: "虚空之主"
 br_pve_boss_plural: "虚空之主"
 br_pve_boss_desc: "从星系中心裂痕中涌出的远古虚空实体，正在吞噬整个星系。"
 BR_BOSS_SECTION: "虚空核心"
 BR_BOSS_SECTION_DESC: "虚空之主的核心躯壳，搭载裂界主炮与厚重的虚空护甲。"
 br_pve_wave_title: "虚空侵蚀波次"
 br_pve_wave_desc_1: "虚空能量正在扩散。第1波侵蚀舰队已出现在危险区。"
 br_pve_wave_desc_2: "虚空能量持续增强。第%ld%波侵蚀舰队已现身。"
 br_pve_boss_approach_title: "虚空裂痕警告"
 br_pve_boss_approach_desc: "传感器检测到星系中心出现巨大能量波动！虚空之主正在苏醒..."
 br_pve_boss_spawn_title: "虚空之主降临"
 br_pve_boss_spawn_desc: "虚空之主已从星系中心的裂痕中现身！摧毁它以净化星系！"
 br_pve_boss_defeated_title: "虚空净化完成"
 br_pve_boss_defeated_desc: "虚空之主已被消灭，星系正在恢复稳定。所有幸存者获得最终胜利！"
 br_pve_boss_kill: "击杀虚空之主"
 br_pve_spawn_shift_title: "传送至边缘"
 br_pve_spawn_shift_desc: "联合舰队指挥部将你的母舰和护航舰队传送至大逃杀战场边缘。那里相对安全，请利用毒圈推进前的准备时间熟悉环境。"
 BR_PVE_KILL_REWARD: "侵蚀舰队歼灭奖励"
 BR_PVE_KILL_REWARD_DESC: "你成功摧毁了虚空侵蚀舰队，从碎片中回收了部分物资。"
 BR_PVE_ELITE_KILL_REWARD: "精英侵蚀舰队歼灭奖励"
 BR_PVE_ELITE_KILL_REWARD_DESC: "你摧毁了一支精英虚空侵蚀舰队，回收了大量高质量物资。"
