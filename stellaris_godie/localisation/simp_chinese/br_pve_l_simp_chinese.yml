 br_pve_boss_kill: "击杀虚空之主"
 br_power_level_display: "虚空等级"
 br_power_level_display_desc: "当前PVE成长等级。此资源仅为旧版UI残留，实际等级状态改由事件窗口播报。"
 BR_LEVEL_STATUS_TITLE: "战斗等级状态"
 BR_LEVEL_STATUS_OK: "继续作战"
 BR_LEVEL_STATUS_1_DESC: "§Y当前等级：§G1级§!  战斗评分：§G[Root.br_combat_score] / 150§!\n已解锁：§B护卫舰§!\n────────────────────\n§Y下一等级：§G2级§!（评分 ≥ 150）\n2级解锁：§B雷击舰§!、§B核心流派选择§!（舰载机/导弹/激光/动能/防御）\n\n['concept_br_level_rules_1']"
 BR_LEVEL_STATUS_2_DESC: "§Y当前等级：§G2级§!  战斗评分：§G[Root.br_combat_score] / 450§!\n已解锁：§B护卫舰 雷击舰§!  §W奖励45%通用+55%流派§!\n────────────────────\n§Y下一等级：§G3级§!（评分 ≥ 450）\n3级解锁：§B驱逐舰§!\n\n['concept_br_level_rules_2']"
 BR_LEVEL_STATUS_3_DESC: "§Y当前等级：§G3级§!  战斗评分：§G[Root.br_combat_score] / 1000§!\n已解锁：§B护卫舰 雷击舰 驱逐舰§!\n────────────────────\n§Y下一等级：§G4级§!（评分 ≥ 1000）\n4级解锁：§B巡洋舰§!  升级奖励可获更高级作战电脑和反应堆\n\n['concept_br_level_rules_3']"
 BR_LEVEL_STATUS_4_DESC: "§Y当前等级：§G4级§!  战斗评分：§G[Root.br_combat_score] / 1800§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰§!\n────────────────────\n§Y下一等级：§G5级§!（评分 ≥ 1800）\n5级解锁：§B战列舰§! §B高级特殊奖励§!（资源换舰船/强科技/强BUFF）\n\n['concept_br_level_rules_4']"
 BR_LEVEL_STATUS_5_DESC: "§Y当前等级：§G5级§!  战斗评分：§G[Root.br_combat_score] / 3000§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰 战列舰§!\n────────────────────\n§Y下一等级：§G6级§!（评分 ≥ 3000）\n6级解锁：§B泰坦§!  升级奖励25%混入高级特殊事件\n\n['concept_br_level_rules_5']"
 BR_LEVEL_STATUS_6_DESC: "§Y当前等级：§G6级§!  战斗评分：§G[Root.br_combat_score] / 5000§!\n已解锁：§B护卫舰 雷击舰 驱逐舰 巡洋舰 战列舰 泰坦§!\n────────────────────\n§Y下一等级：§G7级§!（评分 ≥ 5000）\n7级解锁：§B主宰级母舰§!（最高舰船）\n\n['concept_br_level_rules_6']"
 BR_LEVEL_STATUS_7_DESC: "§Y当前等级：§G7级（最高）§!  战斗评分：§G[Root.br_combat_score]§!\n已解锁：§B全部舰船§!（含主宰级母舰）\n────────────────────\n§W已满级，继续战斗仍可获得普通奖励和高级特殊事件§!\n\n['concept_br_level_rules_7']"
 concept_br_level_rules_1: "§Y=== 等级规则 ===§!\n• 击杀虚空侵蚀舰队获得§G战斗评分§!\n• 达到阈值自动升级，全联盟共享等级\n• 升级触发升级奖励（科技/BUFF/资源）\n• 击杀/爆星触发普通奖励（15%概率，爆星100%）\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G150§!"
 concept_br_level_rules_2: "§Y=== 等级规则 ===§!\n• §B流派已选择§!，奖励偏向所选方向\n• 每级自动获得对应舰船科技\n• 爆星必定触发普通奖励，击杀15%概率\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G450§!"
 concept_br_level_rules_3: "§Y=== 等级规则 ===§!\n• 升级奖励可获作战电脑和反应堆\n• 更高等级对应更高级科技选项\n• 普通奖励池已完全激活\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G1000§!"
 concept_br_level_rules_4: "§Y=== 等级规则 ===§!\n• 升级奖励可获更高级部件科技\n• 通用奖励池出现高级推进器、护盾等\n• 流派奖励持续深化\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G1800§!"
 concept_br_level_rules_5: "§Y=== 等级规则 ===§!\n• §B高级特殊奖励已解锁§!（25%混入升级奖励）\n• 高级奖励：消耗资源换舰队增援/科技/强BUFF\n• 增援：护航(4500合金) / 主力(9000合金)\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G3000§!"
 concept_br_level_rules_6: "§Y=== 等级规则 ===§!\n• 高阶舰队（战列舰/泰坦）已完全开放\n• 资源兑换BUFF和舰船收益明显提高\n• 升级奖励池继续包含高级特殊事件\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G5000§!"
 concept_br_level_rules_7: "§Y=== 等级规则 ===§!\n• §B已达成最高等级！§!\n• 全部舰船已解锁，可兑换主宰级母舰\n• 继续战斗仍可获得普通和高级奖励\n• §B主宰母舰：§!18000合金+500异星天然气+500挥发微粒\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分"
 BR_PVE_KILL_REWARD: "侵蚀舰队歼灭奖励"
 BR_PVE_KILL_REWARD_DESC: "你成功摧毁了虚空侵蚀舰队，从碎片中回收了部分物资。"
 BR_PVE_ELITE_KILL_REWARD: "精英侵蚀舰队歼灭奖励"
 BR_PVE_ELITE_KILL_REWARD_DESC: "你摧毁了一支精英虚空侵蚀舰队，回收了大量高质量物资。"
