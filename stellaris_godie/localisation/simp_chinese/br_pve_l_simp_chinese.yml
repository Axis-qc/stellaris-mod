 concept_br_level_rules_1_desc: "• 击杀虚空侵蚀舰队获得§G战斗评分§!\n• 达到阈值自动升级，全联盟共享等级\n• 升级触发升级奖励（科技/BUFF/资源）\n• 击杀/爆星触发普通奖励（15%概率，爆星100%）\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G80§!"
 concept_br_level_rules_2_desc: "• §B流派已选择§!，奖励偏向所选方向\n• 每级自动获得对应舰船科技\n• 爆星必定触发普通奖励，击杀15%概率\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G250§!"
 concept_br_level_rules_3_desc: "• 升级奖励可获作战电脑和反应堆\n• 更高等级对应更高级科技选项\n• 普通奖励池已完全激活\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G550§!"
 concept_br_level_rules_4_desc: "• 升级奖励可获更高级部件科技\n• 通用奖励池出现高级推进器、护盾等\n• 流派奖励持续深化\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G1000§!"
 concept_br_level_rules_5_desc: "• §B高级特殊奖励已解锁§!（25%混入升级奖励）\n• 高级奖励：消耗资源换舰队增援/科技/强BUFF\n• 增援：护航(4500合金) / 主力(9000合金)\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G1700§!"
 concept_br_level_rules_6_desc: "• 高阶舰队（战列舰/泰坦）已完全开放\n• 资源兑换BUFF和舰船收益明显提高\n• 升级奖励池继续包含高级特殊事件\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G2700§!"
 concept_br_level_rules_7_desc: "• §B主宰已解锁§!\n• 战斗评分继续积累可触发Boss战\n• 继续战斗仍可获得普通和高级奖励\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G4500§! 触发§RBoss§!"
 concept_br_level_rules_8_desc: "• §BPVE Boss已被触发！§!\n• 全联盟合作击败Boss赢得胜利\n• 继续提升等级获取更强奖励\n• 高级特殊奖励继续深化\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G7000§!"
 concept_br_level_rules_9_desc: "• 战斗评分持续提升\n• 继续战斗获得普通和高级奖励\n• Boss战斗进行中\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G10000§!"
 concept_br_level_rules_10_desc: "• 战斗评分持续提升\n• 继续战斗获得普通和高级奖励\n• Boss战斗进行中\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G14000§!"
 concept_br_level_rules_11_desc: "• 战斗评分持续提升\n• 继续战斗获得普通和高级奖励\n• 距离满级一步之遥\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分\n────────────────────\n§Y升级目标：§!评分达到 §G20000§!"
 concept_br_level_rules_12_desc: "• §B已达成最高等级！§!\n• 全部舰船已解锁，可兑换主宰级母舰\n• 继续战斗仍可获得普通和高级奖励\n• §B主宰母舰：§!18000合金+500异星天然气+500挥发微粒\n────────────────────\n§Y经验来源：§!\nBoss：1000分  战列舰：80分  巡洋舰：45分\n驱逐舰：25分  护卫舰：12分  爆星：50分"
