 # ======== 1. 噬星者 (Stellarite) ========

 # ---- 舰船 ----
 lev_stellarite: "噬星者"
 lev_stellarite_plural: "噬星者"
 lev_stellarite_cap: "噬星者"
 lev_stellarite_desc: "吞噬恒星的巨型利维坦。以恒星为食，被它改造过的星系将永久改变气候。"
 lev_stellarite_DESC: "吞噬恒星的巨型利维坦。以恒星为食，被它改造过的星系将永久改变气候。"

 # ---- 区段 / 组件 ----
 lev_stellarite_key: "噬星者舰体"
 LEV_STELLARITE_CORE: "§R噬星者核心§!"
 LEV_STELLARITE_CORE_DESC: "噬星者利维坦的核心，承载吞噬恒星、重燃恒星、恒星光束与腹中日轮四项能力。"
LEV_STELLARITE_REACTOR: "噬星者星核"
LEV_STELLARITE_REACTOR_DESC: "噬星者吞食恒星物质后在体内炼成的能量器官。它不是被安装上去的机械，而是这头巨兽活着的心脏。"
LEV_STELLARITE_THRUSTER: "噬星者能量喷射"
LEV_STELLARITE_THRUSTER_DESC: "噬星者把吞下的恒星物质自星核喷涌而出，如鲸喷吐水雾，却推得动恒星般的巨躯。"
LEV_STELLARITE_BEAM: "吞噬光束"
LEV_STELLARITE_BEAM_DESC: "噬星者从口中喷出的恒星光束。它把吞下的恒星物质压成一道贯穿型能量流，扫过之处如同恒星表面掠过。"
LEV_STELLARITE_MISSILE: "噬星者鱼雷"
LEV_STELLARITE_MISSILE_DESC: "从噬星者体内甩出的高密度物质团。带着被吞恒星的重元素飞出，命中时越过护盾直接撕开舰体。"
LEV_STELLARITE_PLASMA: "噬星者等离子炮"
LEV_STELLARITE_PLASMA_DESC: "噬星者喷出的等离子流。恒星物质在它体内被持续压缩、加热，然后成束甩向敌舰。"
LEV_STELLARITE_LASER: "噬星者激光"
LEV_STELLARITE_LASER_DESC: "噬星者体表的光束触须。用来打掉逼近的导弹与舰载机，不负责杀伤主力舰。"

 # ---- 建造限制提示 ----
 not_has_lev_stellarite: "§H已拥有噬星者§!"

 # ---- 技能按钮 ----
 lev_stellarite_ignite_button: "§G重燃恒星§!\n  注入能量使光谱§B升一级§!，行星升温，冰封殖民地化为§G盖亚§!（§R重塑行星地表§!）。\n  消耗§Y1§!能量　冷却§Y360§!天　当前：能量§Y[Root.owner.lev_stellarite_energy]§!"
 lev_stellarite_beam_button: "§G恒星光束§!\n  在星系图上点选目标星系，就地张口蓄能，§Y20§!天后朝该星系喷出吞下的星光，灼烧其中全部敌舰，§R[lev_beam_damage_display]§!伤害，消耗§Y1§!能量。\n  射程限于自身传感器范围　蓄能§Y20§!天　冷却§Y90§!天"
 lev_stellarite_sunburst_button: "§G腹中日轮§!\n  把体内囤积的恒星物质一次点燃，本星系敌舰各受§R[lev_sun_damage_display]§!伤害，行星地表被烤成§R[lev_sun_dev_display]§!破坏度。\n  蓄能§Y30§!天　冷却§Y480§!天　消耗§Y5§!能量　当前：能量§Y[Root.owner.lev_stellarite_energy]§!"

