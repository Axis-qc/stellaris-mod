 # ---- modifier 名 ----
 lev_tiyk_1_dmg: "巨鲸冲撞·破浪"
 lev_tiyk_1_dmg_desc: "巨躯以迁徙万年的蛮力撞进战阵，撞上的东西没有完好的。当前效果：§G武器伤害+[lev_sk_tiyk_1_dmg]%§!。"
 lev_tiyk_1_fr: "巨鲸冲撞·连破"
 lev_tiyk_1_fr_desc: "冲势不减，撞开一艘便扑向下一般。当前效果：§G射速+[lev_sk_tiyk_1_fr]%§!。"
 lev_tiyk_2_hr: "群体再生"
 lev_tiyk_2_hr_desc: "母兽的歌声里有一种古老的安稳，伤口在歌声里悄悄合拢。当前效果：§G船体再生+[lev_sk_tiyk_2_hr]/10%/天§!。"
 lev_tiyk_u_fr: "母兽号令"
 lev_tiyk_u_fr_desc: "号令既出，兽群与舰队皆知何时该亮出獠牙。当前效果：§G射速+[lev_sk_tiyk_u_fr]%§!。"

