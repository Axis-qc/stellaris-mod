l_simp_chinese:
 # ---- 国民理念 ----
  lev_star_overlords: "星海之国"
  lev_star_corporate: "星海企业"
  lev_star_hive: "星海蜂巢"
  lev_star_machine: "星海机械"
  lev_star_overlords_desc: "这个文明将远古时代的庞然巨物视作立国之本。他们不建造舰队，而是唤醒、驯化并驱使那些本该沉睡于星海深处的存在。"
  lev_star_overlords_effects: "§G解锁利维坦事件链§!：随时间推移，远古的巨兽与造物将陆续归入你的麾下。\n\n§R代价§!：从此与常规海军渐行渐远。"

 # ---- 开局选择事件 ----
  lev.12.name: "远古的回响"
  lev.12.desc: "边境星系的观测站传回了异常的引力读数。一头以恒星为食的庞然巨物正在那里游弋——它比你的文明古老得多，也比你全部的舰队庞大得多。\n\n在它转身离去之前，你还有机会与它建立联结。"
  lev.12.a: "与噬星者建立联结"

