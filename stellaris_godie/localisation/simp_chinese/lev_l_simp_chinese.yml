 # ---- 成长值系统 · 变量 ----
 lev_growth: "成长值"
 lev_growth_desc: "巨兽已经攒下的养料。战场上的撕咬与你投下的喂养都会计入，攒够一阶便再长一级。"
 lev_growth_level: "成长等级"
 lev_growth_level_desc: "巨兽已经长成的阶数。每高一阶，爪牙更利、外壳更厚、伤口愈合更快。"
 lev_growth_next: "下一阶所需养料"
 lev_growth_next_desc: "再长一阶还差多少。"
 lev_feed_level: "营养档位"
 lev_feed_level_desc: "你每月为它备下多少养分。喂得厚，长得快，能量币也烧得快。"

