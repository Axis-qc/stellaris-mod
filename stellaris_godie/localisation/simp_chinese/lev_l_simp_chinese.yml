 lev_tiyanki_cap: "缇扬奇族母"
 lev_tiyanki_desc: "缇扬奇群的年长母兽，族群的迁徙皆随她的意志。她曾在星海间悠然游弋，如今为你引路。"
 lev_tiyanki_DESC: "缇扬奇群的年长母兽，族群的迁徙皆随她的意志。她曾在星海间悠然游弋，如今为你引路。"

 # ---- 区段 / 组件 ----
 lev_tiyanki_key: "缇扬奇族母舰体"
 LEV_TIYANKI_CORE: "§R族母核心§!"
 LEV_TIYANKI_CORE_DESC: "缇扬奇族母利维坦的核心，承载跃迁、群体再生与母兽号令三项能力。随成长等级提升船体、船体再生与护甲。"
 LEV_TIYANKI_REACTOR: "族母 生命之炉"
 LEV_TIYANKI_REACTOR_DESC: "亿万年的迁徙在她体内烧出一座生生不息的熔炉，族群的生机皆源于此。"
 LEV_TIYANKI_THRUSTER: "族母 鳍肢游动"
 LEV_TIYANKI_THRUSTER_DESC: "宽大的鳍肢缓缓摆动，推着族母庞大的身躯在星海间迁徙，一如亿万年来那样。"

 # ---- 建造限制提示 ----
 not_has_lev_tiyanki: "§H已拥有缇扬奇族母§!"

 # ---- 技能按钮 ----
 lev_tiyanki_ram_button: "§G巨鲸冲撞§!\n  巨躯全速突进，自身§G武器伤害 +[lev_sk_tiyk_1_dmg]%§!、§G射速 +[lev_sk_tiyk_1_fr]%§!。\n  持续§Y20§!天　冷却§Y180§!天"
 lev_tiyanki_herd_regen_button: "§G群体再生§!\n  母兽的歌声抚过每一艘随行的舰船，本舰队全体§G船体再生 +[lev_sk_tiyk_2_hr]/10%/天§!。\n  持续§Y30§!天　冷却§Y240§!天"
 lev_tiyanki_matriarch_call_button: "§G母兽号令§!\n  长鸣穿透星海，兽群与舰队同频共振，本舰队全体§G射速 +[lev_sk_tiyk_u_fr]%§!。\n  持续§Y40§!天　冷却§Y480§!天"

