 br_level_initialized: "等级系统已初始化"
 br_level_initialized_desc: "标记该PVE玩家国家的等级系统变量已完成初始化。"

 br_void_path_initialized: "虚境倾向已初始化"
 br_void_path_initialized_desc: "标记PVE房主国家上的Boss虚境倾向变量已初始化。"

 br_reward_level_up_now: "升级奖励待触发"
 br_reward_level_up_now_desc: "临时标记：玩家刚刚提升了等级，需要触发升级奖励事件。"

 br_reward_initialized: "奖励系统已初始化"
 br_reward_initialized_desc: "标记该玩家国家的奖励系统变量与状态已完成初始化。"

 br_vars_initialized: "变量已初始化"
 br_vars_initialized_desc: "标记该国家已执行变量初始化事件（br.3），所有国家级变量已设为初始值。"

