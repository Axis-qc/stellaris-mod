 # ============================================
 # 数值变量 (Variables)
 # ============================================
 br_combat_score: "战斗经验"
 br_combat_score_desc: "玩家通过摧毁敌方舰船、爆星采掘等方式累积的战斗经验分数。用于计算玩家等级。"

 br_power_level: "战力等级"
 br_power_level_desc: "基于总战斗经验计算的玩家战力等级（1-12级）。等级越高，解锁的奖励品质越高。"

 br_kill_score: "击杀分数"
 br_kill_score_desc: "击杀奖励计数器。每累积100分触发一次击杀奖励。"

 br_kill_reward_threshold: "击杀奖励阈值（已弃用）"

 br_level_month_counter: "等级月度计数"
 br_level_month_counter_desc: "用于标记每年发送一次等级状态报告的月度计数器。"

 br_void_conquest: "征服倾向"
 br_void_conquest_desc: "虚境Boss的征服倾向累计值，决定最终Boss进化方向。"

 br_void_oblivion: "湮灭倾向"
 br_void_oblivion_desc: "虚境Boss的湮灭倾向累计值，决定最终Boss进化方向。"

 br_void_sacrifice: "献祭倾向"
 br_void_sacrifice_desc: "虚境Boss的献祭倾向累计值，决定最终Boss进化方向。"

 br_void_evolution: "进化倾向"
 br_void_evolution_desc: "虚境Boss的进化倾向累计值，决定最终Boss进化方向。"

 br_void_taboo: "禁忌倾向"
 br_void_taboo_desc: "虚境Boss的禁忌倾向累计值，决定最终Boss进化方向。"

 br_spawn_counter: "刷敌计数器"
 br_spawn_counter_desc: "PVE敌军刷怪系统的临时循环计数器，用于控制各圈层的舰队生成数量。"

 br_shrink_count: "缩圈计数"
 br_shrink_count_desc: "缩圈系统的循环计数变量，记录当前已完成的缩圈次数。"

 br_pending_reward: "待处理奖励分（已弃用）"

 br_vanguard_power_skill_cd: "火力核心主动技能冷却"
 br_vanguard_power_skill_cd_desc: "火力核心主动技能的剩余冷却天数。为0或未设置时，先锋级主动技能按钮可用。"

 br_vanguard_power_ultimate_cd: "火力核心旗舰超载冷却"
 br_vanguard_power_ultimate_cd_desc: "火力核心旗舰超载的剩余冷却天数。为0或未设置时，旗舰超载按钮可用。"

 br_vanguard_defense_skill_cd: "防御核心主动技能冷却"
 br_vanguard_defense_skill_cd_desc: "防御核心主动技能的剩余冷却天数。为0或未设置时，先锋级主动技能按钮可用。"

 br_vanguard_support_skill_cd: "支援核心主动技能冷却"
 br_vanguard_support_skill_cd_desc: "支援核心主动技能的剩余冷却天数。为0或未设置时，先锋级主动技能按钮可用。"

 br_dominator_regen_charge: "母舰再生力场充能层数"
 br_dominator_regen_charge_desc: "母舰再生力场技能的充能层数（0-3）。每60天自动+1，使用技能时消耗全部层数，持续天数=30×层数。"

