 br_hero_core_support_desc: "玩家选择了支援核心——专精辅助型技能模组。"

 br_pve_victory: "PVE胜利"
 br_pve_victory_desc: "标记该玩家已击败PVE最终Boss并获得胜利。"

 br_player_country: "玩家国家"
 br_player_country_desc: "标记该国家为玩家控制的国家。"

 br_pve_enemy: "PVE敌方"
 br_pve_enemy_desc: "标记该国家为PVE敌方国家。"

 br_pve_crisis_country: "PVE天灾国家"
 br_pve_crisis_country_desc: "标记该国家为PVE天灾国家类型。"

 br_test_country: "测试国家"
 br_test_country_desc: "标记该国家为调试/测试用途的辅助国家。"

 br_start_init: "开局初始化完成"
 br_start_init_desc: "标记该国家已完成开局初始化流程。"

 br_player_replacement_scheduled: "玩家替换已排期"
 br_player_replacement_scheduled_desc: "标记该断线玩家已被排入替换队列。"

 br_reward_unlock_dominator: "主宰已解锁"
 br_reward_unlock_dominator_desc: "标记该玩家已通过奖励系统解锁主宰建造权限。"

 br_debug_mode: "调试模式"
 br_debug_mode_desc: "调试开关：激活后显示所有测试法令，用于手动切换技能flag、调试英雄舰系统。"

 br_skill_phase_shift_unlocked: "相位转移已解锁"
 br_skill_phase_shift_unlocked_desc: "英雄舰主动技能：相位转移——自身获得减伤+嘲讽，武器伤害-100%，同时星系友方获得每日船体/护甲/护盾再生，持续10×倍率天。冷却240天。"

 br_skill_energy_overclock_unlocked: "能量超频已解锁"
 br_skill_energy_overclock_unlocked_desc: "火力核心主动技能：能量超频——短时间内大幅提升先锋级武器伤害，持续10天。"

 br_skill_weakness_scan_unlocked: "弱点扫描已解锁"
 br_skill_weakness_scan_unlocked_desc: "火力核心主动技能：弱点扫描——标记本星系敌方舰队使其受到武器伤害+30%，持续15天，冷却120天。"

 br_skill_combat_stack_unlocked: "战意过载已解锁"
  br_skill_combat_stack_unlocked_desc: "火力核心被动技能：进入战斗后为星系内所有友方单位提供武器伤害加成，脱离战斗后衰减。"

 br_skill_kill_stack_unlocked: "越战越勇已解锁"
 br_skill_kill_stack_unlocked_desc: "火力核心被动技能：每击杀一艘敌舰永久提升武器伤害，上限50%。"

  br_skill_fullfire_unlocked: "火力全开已解锁"
  br_skill_fullfire_unlocked_desc: "火力核心旗舰超载技能：射速+200%，武器伤害+50%，持续15天；结束后射速-30%持续15天。冷却300天。"

  br_skill_final_volley_unlocked: "终末齐射已解锁"
  br_skill_final_volley_unlocked_desc: "火力核心旗舰超载技能：为星系内所有友方单位提供武器伤害+75%、射速+75%，持续10天，冷却360天。"

  br_combat_buff_active: "战斗buff已激活"
 br_combat_buff_active_desc: "临时标记：有玩家舰队正在战斗中，all_country_buff 持续生效。脱战后15天内自动清除。"

 br_vanguard_skill_cd_tick_running: "先锋主动技能冷却计时运行中"
 br_vanguard_skill_cd_tick_running_desc: "临时标记：先锋级主动技能冷却每日递减事件正在运行，避免重复排队。"

