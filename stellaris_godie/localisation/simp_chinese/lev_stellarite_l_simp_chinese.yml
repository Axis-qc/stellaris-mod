l_simp_chinese:
 # ============================================
 # 利维坦·噬星者 (Leviathan - Stellarite)
 # 独立文件，不复用 br_* 本地化
 # ============================================

 # ---------- 舰船 ----------
 lev_stellarite: "噬星者"
 lev_stellarite_plural: "噬星者"
 lev_stellarite_cap: "噬星者"
 lev_stellarite_desc: "吞噬恒星的巨型利维坦。以恒星为食，被它改造过的星系将永久改变气候。"
 lev_stellarite_DESC: "吞噬恒星的巨型利维坦。以恒星为食，被它改造过的星系将永久改变气候。"

 LEV_STELLARITE_FLEET: "噬星者"

 # ---------- 区段 / 组件 ----------
 lev_stellarite_key: "噬星者舰体"

 LEV_STELLARITE_CORE: "§R噬星者核心§!"
 LEV_STELLARITE_CORE_DESC: "噬星者利维坦的核心，承载吞噬恒星、重燃恒星与恒星光束三项能力。"

 # ---------- 建造限制提示 ----------
 not_has_lev_stellarite: "§H已拥有噬星者§!"

 # ---------- 国家级变量 ----------
 lev_stellarite_energy: "恒星能量"
 lev_stellarite_energy_desc: "噬星者体内储存的能量，由吞食的恒星物质炼成。吞噬恒星§G+1§!，重燃恒星与恒星光束各§R-1§!，上限§Y10§!。"

 lev_growth: "成长"
 lev_growth_desc: "噬星者的成长度。吞噬恒星 +1；重燃恒星 -1。每点提供 +5% 武器伤害、+300 护甲、+2% 船体再生。上限 10。"

 # ---------- 调试法令 ----------
 edict_lev_test_spawn_stellarite: "§R[调试] 发放噬星者§!"
 edict_lev_test_spawn_stellarite_desc: "立刻在首都发放一艘噬星者（并补齐解锁与设计）。可反复执行。"

 edict_lev_test_energy_max: "§R[调试] 能量与成长拉满§!"
 edict_lev_test_energy_max_desc: "把恒星能量与成长直接设为 10，用于测试成长属性上限。"

 edict_lev_test_energy_zero: "§R[调试] 能量与成长归零§!"
 edict_lev_test_energy_zero_desc: "把恒星能量与成长直接设为 0，用于测试消耗与下限。"

 edict_lev_test_reset_unlock: "§R[调试] 清除噬星者解锁§!"
 edict_lev_test_reset_unlock_desc: "移除解锁 flag（不删除已有舰船），用于重测开局发放流程。"

 # ============================================
 # 噬星者 — 组件
 # ============================================

## 星核（能量器官，生命体自身炼成，无档位）
LEV_STELLARITE_REACTOR: "噬星者星核"
LEV_STELLARITE_REACTOR_DESC: "噬星者吞食恒星物质后在体内炼成的能量器官。它不是被安装上去的机械，而是这头巨兽活着的心脏。"

## 能量喷射（原生推进，无档位）
LEV_STELLARITE_THRUSTER: "噬星者能量喷射"
LEV_STELLARITE_THRUSTER_DESC: "噬星者从星核抽取能量、向身后喷出的推进方式。无需人类推进科技的支撑。"

 # ============================================
 # 技能
 # ============================================

 ## 按钮
 lev_stellarite_absorb_button: "§G吞噬恒星§!\n  吞食目标恒星的物质，使其光谱型向红端衰变一级，星系内行星随之降温。获得§Y+1§!能量与成长。\n  冷却：§Y360§!天　当前：能量§Y[Root.owner.lev_stellarite_energy]§!／成长§Y[Root.owner.lev_growth]§!"

 lev_stellarite_ignite_button: "§G重燃恒星§!\n  将储存的能量注入恒星，使其光谱型向蓝端跃升一级，星系内行星升温，冰封殖民地化为盖亚。§R会重塑行星地表§!。消耗§Y1§!点能量与成长。\n  冷却：§Y360§!天　当前：能量§Y[Root.owner.lev_stellarite_energy]§!／成长§Y[Root.owner.lev_growth]§!"

 lev_stellarite_beam_button: "§G恒星光束§!\n  汇聚恒星能量成束，灼烧星系内敌方舰队，单次造成§R[lev_beam_damage_display]§!伤害。消耗§Y1§!点能量。\n  冷却：§Y90§!天　当前：能量§Y[Root.owner.lev_stellarite_energy]§!／成长§Y[Root.owner.lev_growth]§!"

 ## 失败提示
 lev_fail_not_star: "只能对恒星使用"
 lev_absorb_fail_no_energy: "恒星能量已满，无法再吸收"
 lev_absorb_fail_edge: "该恒星已降至红巨星，无法继续吸收"
 lev_absorb_fail_multi_star: "多星系统无法改写光谱型"
 lev_absorb_fail_special_star: "该星体无法被改写"
 lev_absorb_fail_own_colony: "本国星系内存在殖民地，吸收会伤及自身"

 lev_ignite_fail_no_energy: "恒星能量不足（至少需要 1 点）"
 lev_ignite_fail_edge: "该恒星已达蓝星，无法继续重燃"
 lev_ignite_fail_multi_star: "多星系统无法改写光谱型"
 lev_ignite_fail_special_star: "该星体无法被改写"

 lev_beam_fail_no_energy: "恒星能量不足（至少需要 1 点）"

 ## 神经接口与舰船行为
 LEV_STELLARITE_COMBAT_COMPUTER: "噬星者神经接口"
 lev_STELLARITE_BEHAVIOR_DESC: "噬星者的神经接口。它将巨兽的感知与意志接驳到指挥链上，使舰队可以在战斗中直接驱动这头生物。"

 ## 舰队 UI
 lev_stellarite_absorb_activity_key: "吞噬 $NAME$ 的恒星"
 lev_stellarite_absorb_progress_key: "吞噬中：$PROGRESS$"
 lev_stellarite_absorb_menu_title: "吞噬恒星"

 lev_stellarite_ignite_activity_key: "重燃 $NAME$ 的恒星"
 lev_stellarite_ignite_progress_key: "重燃中：$PROGRESS$"
 lev_stellarite_ignite_menu_title: "重燃恒星"

 lev_stellarite_beam_activity_key: "向 $NAME$ 发射恒星光束"
 lev_stellarite_beam_progress_key: "充能中：$PROGRESS$"
 lev_stellarite_beam_menu_title: "恒星光束"

 ## 外交修正
 lev_star_devoured: "恒星被吞噬"
