 # 虚空裁决射线
 # ============================================================
 BR_VANGUARD_JUDGMENT_BEAM_1:0 "虚空裁决射线 §Y[1级]§!"
 BR_VANGUARD_JUDGMENT_BEAM_1_DESC:0 "先锋级英雄舰的泰坦主炮，将高浓度虚空能量压缩为毁灭性射束。击中目标时释放虚空压制场（范围§Y25§!），范围内敌舰移速/射速/闪避§R-30%§!。
 BR_VANGUARD_JUDGMENT_BEAM_2:0 "虚空裁决射线 §Y[2级]§!"
 BR_VANGUARD_JUDGMENT_BEAM_2_DESC:0 "经过战场数据优化后的大功率裁决射线。击中目标时释放虚空压制场（范围§Y33§!），范围内敌舰移速/射速/闪避§R-40%§!。
 BR_VANGUARD_JUDGMENT_BEAM_3:0 "虚空裁决射线 §Y[3级]§!"
 BR_VANGUARD_JUDGMENT_BEAM_3_DESC:0 "完全充能的虚空裁决射线，单发即可撕裂敌方旗舰阵列。击中目标时释放虚空压制场（范围§Y40§!），范围内敌舰移速/射速/闪避§R-50%§!。
 BR_VANGUARD_JUDGMENT_BEAM:0 "虚空裁决射线"
 BR_JUDGMENT_BEAM_FLEET_EFFECT:0 "§Y虚空压制：§!击中目标时对范围内敌方舰船施加压制（移速/射速/闪避降低）"
 br_judgment_suppression:0 "虚空裁决·压制"
 br_judgment_suppression_desc:0 "被虚空裁决射线波及，舰船系统受到干扰，移速/射速/闪避降低。"

