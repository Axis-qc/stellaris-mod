 FLEETORDER_DESTROY_PLANET_WITH_BR_PLANET_KILLER_HARVESTER:0 "正在准备采掘$PLANET|Y$"
 MESSAGE_DESC_FOR_BR_PLANET_KILLER_HARVESTER:0 "被母舰采掘光束彻底瓦解"
 BR_PLANET_KILLER_HARVESTER_DESC:0 "专为大逃杀战场设计的行星采掘武器。母舰向目标宜居星球核心注入超频采掘光束，将行星结构彻底瓦解为碎岩与矿尘，并从中回收大量合金与战略资源。被采掘的星球将不复存在，留下的只有漂浮的残骸带。"
 BR_DOMINATOR_SECTION:0 "母舰核心"
 BR_DOMINATOR_SECTION_DESC:0 "母舰的核心区段，挂载采掘光束并为移动船坞系统预留能源和控制接口。"
 BR_DOMINATOR_REACTOR:0 "母舰零点反应堆"
 BR_DOMINATOR_REACTOR_DESC:0 "为母舰单独配置的高输出反应堆，用于支撑行星级采掘光束与移动船坞系统。"
 br_dominator_repair:0 "结构修复"
 br_dominator_repair_activity_key:0 "释放修复脉冲"
 br_dominator_repair_menu_title:0 "$br_dominator_repair$"
 br_dominator_repair_ship_button:0 "§H$br_dominator_repair_menu_title$§!\n当前星系内所有友军舰队修复§G25%§!船体和装甲。\n冷却：§Y30天§!"
