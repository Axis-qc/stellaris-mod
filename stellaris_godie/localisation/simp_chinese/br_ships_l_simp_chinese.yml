 br_dominator_DESC:0 "母舰级核心旗舰，装备虚空能量采掘光束，集成移动船坞系统。"
 BR_DESTRUCTION_REWARD_BIOSPHERE_TITLE:0 "生物圈采掘完成"
 BR_DESTRUCTION_REWARD_BIOSPHERE_DESC:0 "母舰撕开了目标星球的生物圈与海陆循环系统。基础合金、能量币和矿物已自动回收。\n\n剩余物质仍可重组为一批额外储备："
 BR_DESTRUCTION_REWARD_BIOSPHERE_FOOD:0 "回收有机质（+1500食物）"
 BR_DESTRUCTION_REWARD_BIOSPHERE_SOCIETY:0 "提取生态样本（+1200社会学研究）"
 BR_DESTRUCTION_REWARD_BIOSPHERE_CONSUMER:0 "压制可用物资（+600消费品）"
 BR_DESTRUCTION_REWARD_GEOTHERMAL_TITLE:0 "地热层采掘完成"
 BR_DESTRUCTION_REWARD_GEOTHERMAL_DESC:0 "母舰在干涸地壳下捕获到高压能流与不稳定挥发物。基础合金、能量币和矿物已自动回收。\n\n请选择额外回收方向："
 BR_DESTRUCTION_REWARD_GEOTHERMAL_ENERGY:0 "导出地热能流（+2200能量币）"
 BR_DESTRUCTION_REWARD_GEOTHERMAL_GASES:0 "封存异星天然气（+120异星天然气）"
 BR_DESTRUCTION_REWARD_GEOTHERMAL_MOTES:0 "收束高能微粒（+120易爆微粒）"
 BR_DESTRUCTION_REWARD_CRYSTAL_TITLE:0 "寒晶矿脉采掘完成"
 BR_DESTRUCTION_REWARD_CRYSTAL_DESC:0 "母舰粉碎了冰封地幔，暴露出高纯矿脉和稀有晶格。基础合金、能量币和矿物已自动回收。\n\n请选择额外回收方向："
 BR_DESTRUCTION_REWARD_CRYSTAL_MINERALS:0 "粉碎深层矿脉（+1400矿物）"
 BR_DESTRUCTION_REWARD_CRYSTAL_RARE:0 "切割稀有晶格（+120稀有水晶）"
 BR_DESTRUCTION_REWARD_CRYSTAL_ALLOYS:0 "熔炼重金属核（+700合金）"
 BR_DESTRUCTION_REWARD_INFRASTRUCTURE_TITLE:0 "巨构残骸采掘完成"
 BR_DESTRUCTION_REWARD_INFRASTRUCTURE_DESC:0 "母舰回收了目标星球上的城市骨架、遗落设施或巨构支撑层。基础合金、能量币和矿物已自动回收。\n\n请选择额外回收方向："
 BR_DESTRUCTION_REWARD_INFRASTRUCTURE_ALLOYS:0 "拆解结构合金（+1000合金）"
 BR_DESTRUCTION_REWARD_INFRASTRUCTURE_ENGINEERING:0 "解析工程档案（+1500工程学研究）"
 BR_DESTRUCTION_REWARD_INFRASTRUCTURE_UNITY:0 "广播战利品宣告（+1200凝聚力）"
 BR_DESTRUCTION_REWARD_MANTLE_TITLE:0 "地幔采掘完成"
 BR_DESTRUCTION_REWARD_MANTLE_DESC:0 "母舰将目标星球剥离到破碎地幔层。基础合金、能量币和矿物已自动回收。\n\n请选择额外回收方向："
 BR_DESTRUCTION_REWARD_MANTLE_ALLOYS:0 "精炼金属残核（+650合金）"
 BR_DESTRUCTION_REWARD_MANTLE_ENERGY:0 "抽取残余热能（+1800能量币）"
 BR_DESTRUCTION_REWARD_MANTLE_MINERALS:0 "粉碎地幔矿层（+1100矿物）"
