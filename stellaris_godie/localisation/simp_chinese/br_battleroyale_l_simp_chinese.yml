 # ======== br.503 标题/描述（scripted_loc 动态切换）========
 br_speed_title_pve: "能量侵蚀速率评估"
 br_speed_desc_pve: "传感器持续追踪未知能量的扩散模式。侵蚀以星域中心为锚点向外收缩，超空间航道被逐一封闭。请评估侵蚀推进速率。\n\n首次侵蚀将在§Y开局5年§!后开始，侵蚀区内的舰船将持续受损。"
 br_speed_title_pvp: "能量侵蚀速率评估"
 br_speed_desc_pvp: "传感器持续追踪未知能量的扩散模式。侵蚀以星域中心为锚点向外收缩，超空间航道被逐一封闭。请评估侵蚀推进速率。\n\n首次侵蚀将在§Y开局5年§!后开始，侵蚀区内的舰船将持续受损。"
 # ======== 速度选项名/描述（scripted_loc 动态切换）========
 br_speed_fast_name_pve: "§R急速侵蚀§!（每180天推进一圈）"
 br_speed_fast_name_pvp: "§R急速侵蚀§!（每180天推进一圈）"
 br_speed_fast_desc_pve: "未知能量以最快速度侵蚀星域。侵蚀区每§Y5天§!造成一次伤害。留给先遣部队的时间极为紧迫。"
 br_speed_fast_desc_pvp: "未知能量以最快速度侵蚀星域。侵蚀区每§Y5天§!造成一次伤害。留给先遣部队的时间极为紧迫。"
 br_speed_normal_name_pve: "§Y标准侵蚀§!（每360天推进一圈）"
 br_speed_normal_name_pvp: "§Y标准侵蚀§!（每360天推进一圈）"
 br_speed_normal_desc_pve: "未知能量以稳定速率侵蚀星域。侵蚀区每§Y10天§!造成一次伤害。"
 br_speed_normal_desc_pvp: "未知能量以稳定速率侵蚀星域。侵蚀区每§Y10天§!造成一次伤害。"
 br_speed_slow_name_pve: "§G缓慢侵蚀§!（每540天推进一圈）"
 br_speed_slow_name_pvp: "§G缓慢侵蚀§!（每540天推进一圈）"
 br_speed_slow_desc_pve: "未知能量以较慢速度侵蚀星域。侵蚀区每§Y15天§!造成一次伤害。先遣部队有更多时间准备，但不可掉以轻心。"
 br_speed_slow_desc_pvp: "未知能量以较慢速度侵蚀星域。侵蚀区每§Y15天§!造成一次伤害。先遣部队有更多时间准备，但不可掉以轻心。"
