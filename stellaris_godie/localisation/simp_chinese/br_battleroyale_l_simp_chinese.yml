 br_final_circle: "§G最终安全区§!"
 br_settings_title: "大逃杀缩圈设置"
 br_settings_desc: "请选择本局的缩圈节奏。首次缩圈将在开局 3 年后开始，并同步启用圈外伤害。快速：每 180 天缩一圈，圈外伤害每 5 天结算。标准：每 360 天缩一圈，圈外伤害每 10 天结算。慢速：每 540 天缩一圈，圈外伤害每 15 天结算。"
 br_speed_fast_name: "快速缩圈（180 天）"
 br_speed_fast_name_desc: "首次缩圈：开局 3 年后。后续缩圈：每 180 天。圈外伤害：每 5 天结算。"
 br_speed_normal_name: "标准缩圈（360 天）"
 br_speed_normal_name_desc: "首次缩圈：开局 3 年后。后续缩圈：每 360 天。圈外伤害：每 10 天结算。"
 br_speed_slow_name: "慢速缩圈（540 天）"
 br_speed_slow_name_desc: "首次缩圈：开局 3 年后。后续缩圈：每 540 天。圈外伤害：每 15 天结算。"
