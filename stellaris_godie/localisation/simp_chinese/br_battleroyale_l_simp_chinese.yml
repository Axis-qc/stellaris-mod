l_simp_chinese:
 br_final_circle: "§G最终安全区§!"
 br_settings_title: "异常星域先遣报告"
 br_settings_desc: "宇宙基本常数正在被未知力量重写。先遣舰队在超空间跃迁中航线偏移，意外抵达了这片星域的边缘。传感器检测到星域正遭受持续性能量侵蚀，超空间航道逐渐封闭——必须向中心推进，查明源头。请根据传感器反馈下达指令。\n\n§B【友方信号协同】§!——检测到友方通讯信号，建议联合向中心推进，共同应对虚空侵蚀。\n\n§R【不明信号遭遇】§!——检测到多个不明来源的信号，保持警戒，抢先抵达侵蚀核心。\n\n§G【标准银河】§!——忽略异常信号，按正常银河系参数开始游戏。英雄舰系统将在开局1年后自动启用。"
 br_mode_pvp_name: "§R不明信号遭遇§!"
 br_mode_pvp_name_desc: "检测到多个不明来源的信号。无法确认对方意图，建议保持警戒，抢先抵达侵蚀核心。侵蚀速率可自行设定。"
 br_mode_pve_name: "§B友方信号协同§!"
 br_mode_pve_name_desc: "检测到友方通讯信号。建议建立协同频道，联合向星域中心推进，共同应对虚空侵蚀。侵蚀速率可自行设定。"
 br_mode_normal_name: "§G标准银河§!"
 br_mode_normal_name_desc: "忽略异常信号，按正常银河系参数开始游戏。大逃杀机制不会触发，英雄舰系统将在开局1年后自动启用。"
 # 当前未使用：PVE敌方模板开局选择已隐藏，敌方舰队改为随机刷新。
 br_pve_template_settings_title: "PVE敌方模板设置"
 br_pve_template_settings_desc: "请选择本局PVE敌方舰队的主要模板。该设置只决定后续刷怪使用哪组敌舰设计，不会在此时生成敌军。"

 br_pve_template_artillery_name: "炮击模板"
 br_pve_template_artillery_name_desc: "敌军以远距离炮击舰为主，射程远、伤害普通、射速慢、机动慢，惧怕高速贴脸。"
 br_pve_template_brawler_name: "近战模板"
 br_pve_template_brawler_name_desc: "敌军以近战突击舰为主，射程短、伤害高、主动贴脸，适合制造局部高压。"
 br_pve_template_mixed_name: "混合模板"
 br_pve_template_mixed_name_desc: "敌军会混合炮击和近战舰队，避免玩家只用单一解法。"
