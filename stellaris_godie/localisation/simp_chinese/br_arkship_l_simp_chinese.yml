l_simp_chinese:
 # Megastructure 本地化
 br_civilian_arkship_megastructure: "方舟（$civilian_arkship_class$）"
 br_civilian_arkship_megastructure_DESC: "$tech_civilian_arkship_desc$"
 br_civilian_arkship_megastructure_MEGASTRUCTURE_DETAILS: "$tech_civilian_arkship_desc$"
 br_science_arkship_megastructure: "方舟（$science_arkship_class$）"
 br_science_arkship_megastructure_DESC: "$tech_science_arkship_desc$"
 br_science_arkship_megastructure_MEGASTRUCTURE_DETAILS: "$tech_science_arkship_desc$"
 br_military_arkship_megastructure: "方舟（$military_arkship_class$）"
 br_military_arkship_megastructure_DESC: "$tech_military_arkship_desc$"
 br_military_arkship_megastructure_MEGASTRUCTURE_DETAILS: "$tech_military_arkship_desc$"
 # 建筑与模块本地化
 sm_br_arkship_grand_archive: "Grand Archive"
 sm_br_arkship_grand_archive_desc: "这个设施用于收集和展示我们在整个星系中收集到的各种新奇夺目的['concept_specimen', 标本]，包括活体§Y太空兽群§!。"
 sm_br_arkship_engineering_bay: "工程港"
 sm_br_arkship_engineering_bay_desc: "维持这种规模的舰船运转是一场对抗熵增的持久战。零件被改装挪用，系统勉力维持着超越极限的运转，而这样的工作永无休止。"
 sm_br_arkship_beastport: "$sm_beastport$"
 sm_br_arkship_beastport_desc: "$sm_beastport_desc$"
 sm_br_arkship_docking_bay: "停泊区"
 sm_br_arkship_docking_bay_desc: "停泊湾从未安静过。飞船进出穿梭，永无停歇，持续不断的抵达与驶离让方舟号与更广阔的银河系保持着紧密的联系。"
 sm_br_arkship_habitation_module: "居住模块"
 sm_br_arkship_habitation_module_desc: "扩建居住区提升了方舟舰的承载能力。走廊也许很狭窄，但这里是家。"
 sm_br_arkship_sensor_array: "先进传感阵列"
 sm_br_arkship_sensor_array_desc: "编织在船体上的传感器集群扫描着所及范围内的一切。附近太空中的任何事物都无法长时间不被察觉。"
 sm_br_arkship_sensor_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:br_arkship_deep_scan']"
 sm_br_arkship_mining_array: "行星工程学实验室"
 sm_br_arkship_mining_array_desc: "专业的钻探与开采设备能够破开行星地壳，采集蕴藏其中的资源。"
 sm_br_arkship_mining_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:br_arkship_strip_mine']"
 sm_br_arkship_hangar_bay: "机库"
 sm_br_arkship_hangar_bay_desc: "庞大的机库容纳着随时待命紧急出击的飞行中队。我们的打击范围远超舰体本身。"
 sm_br_arkship_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些机库将会用于部署§Y舰载机§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_hangar_bay: "$ARCHAEO_STRIKECRAFT$机库"
 sm_br_arkship_archaeo_hangar_bay_desc: "逝者不得安息。来自早已陨落文明的攻击艇再次驶向星空。"
 sm_br_arkship_archaeo_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$ARCHAEO_STRIKECRAFT$§!。\n"
 sm_br_arkship_psionic_hangar_bay: "灵能轰炸机库"
 sm_br_arkship_psionic_hangar_bay_desc: "屏蔽舱已调谐至灵能武器的共振频率。嗡嗡声无处不在，人们既能听见，也能切身感受到。"
 sm_br_arkship_psionic_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$PSIONIC_STRIKE_CRAFT$§!。\n"
 sm_br_arkship_amoeba_hangar_bay: "$AMOEBA_STRIKE_CRAFT$机库"
 sm_br_arkship_amoeba_hangar_bay_desc: "一个经过改造以安置我们的太空变形虫同伴的加压舱。它们偏爱反应堆附近的温暖区域。"
 sm_br_arkship_amoeba_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$AMOEBA_STRIKE_CRAFT$§!。\n"
 sm_br_arkship_swarm_hangar_bay: "$SWARM_STRIKE_CRAFT_1$机库"
 sm_br_arkship_swarm_hangar_bay_desc: "密集的发射架上装载着数千个自主打击单元，随时准备听令蜂拥出击。"
 sm_br_arkship_swarm_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$SWARM_STRIKE_CRAFT_1$§!。\n"
 sm_br_arkship_laser_battery: "激光炮阵"
 sm_br_arkship_laser_battery_desc: "成排的激光发射器分布在外层船体上，以机械般的精准度循环锁定目标。"
 sm_br_arkship_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y激光§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_laser_battery: "远古穴蚀炮阵"
 sm_br_arkship_archaeo_laser_battery_desc: "回收的武器从设计角度来看就让敌人心神不宁。尽管其运作原理尚未被完全理解，但其致命性毋庸置疑。"
 sm_br_arkship_archaeo_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_LASER$§!。\n"
 sm_br_arkship_lance_battery: "光矛挂载"
 sm_br_arkship_lance_battery_desc: "单条高能长枪通道，能够在大远距离聚焦毁灭性的光束。"
 sm_br_arkship_lance_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些炮塔将会装有§Y粒子光矛§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_particle_launcher: "粒子发射炮阵"
 sm_br_arkship_particle_launcher_desc: "长程粒子发射器以缓慢的射速为代价造成毁灭性伤害，在威胁逼近至攻击距离之前将其消灭。"
 sm_br_arkship_particle_launcher_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些炮塔将会装有§Y粒子发射器§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_psionic_torpedo: "泽珞发射炮阵"
 sm_br_arkship_psionic_torpedo_desc: "鱼雷发射架上装载着灵能弹头，其飞行轨迹由心灵共鸣而非常规制导来引导。"
 sm_br_arkship_psionic_torpedo_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些专用的炮塔将会装有§Y$PSIONIC_TORPEDO$§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_arc_emitter_battery: "电弧挂载"
 sm_br_arkship_arc_emitter_battery_desc: "一组完全无视装甲的电弧发射器，直接对目标系统进行放电。"
 sm_br_arkship_arc_emitter_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些专用的炮塔将会装有§Y电弧发射器§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_psionic_lightning_battery: "$PSIONIC_LIGHTNING$炮阵"
 sm_br_arkship_psionic_lightning_battery_desc: "灵能导管沿舰体噼啪作响，随时准备释放能无视常规防御的定向能量束。"
 sm_br_arkship_psionic_lightning_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些专用的炮塔将会装有§Y$PSIONIC_LIGHTNING$§!。\n"
 sm_br_arkship_mass_driver_battery: "物质投射炮阵"
 sm_br_arkship_mass_driver_battery_desc: "高速动能炮塔，可靠而无情。最古老的武器依然是最有效的武器之一。"
 sm_br_arkship_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y物质投射炮§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_mass_driver_battery: "$ARCHAEO_KINETIC$"
 sm_br_arkship_archaeo_mass_driver_battery_desc: "出土的古代制造动能武器，其枪管公差比现代工程技术所能复刻的任何标准都要精密。"
 sm_br_arkship_archaeo_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_KINETIC$§!。\n"
 sm_br_arkship_kinetic_artillery_battery: "$KINETIC_ARTILLERY_1$"
 sm_br_arkship_kinetic_artillery_battery_desc: "远程动能火炮，用于在目标过于靠近之前对其进行打击。"
 sm_br_arkship_kinetic_artillery_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些炮塔将会装有§Y$KINETIC_ARTILLERY_1$§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_lm_accelerator: "$LM_ACCELERATOR_SET$"
 sm_br_arkship_lm_accelerator_desc: "炮塔内部布满了活体金属导管，能够在交战中进行自我修复，即使在持续损耗下也能维持最高射速。"
 sm_br_arkship_lm_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些专用的炮塔将会装有§Y$LM_ACCELERATOR_SET$§!。\n"
 sm_br_arkship_mass_accelerator: "物质加速器"
 sm_br_arkship_mass_accelerator_desc: "舰体所能承受的最重型动能武器。每一发的速度都足以将护盾和装甲一并击穿。"
 sm_br_arkship_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些炮塔将会装有§Y物质加速器§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_mass_accelerator: "$ARCHAEO_X$"
 sm_br_arkship_archaeo_mass_accelerator_desc: "一台打捞回收的古代加速器，规模惊人，尽管历经数个世纪，其机械结构依然基本完好。"
 sm_br_arkship_archaeo_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_X$§!。\n"
 sm_br_arkship_missile_battery: "导弹发射台"
 sm_br_arkship_missile_battery_desc: "用于攻击远距离目标的导弹发射架。虽然速度比能量武器慢，但极难被敌人抵消伤害。"
 sm_br_arkship_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$这些炮塔将会装有§Y导弹发射器§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_missile_battery: "$ARCHAEO_MISSILE$"
 sm_br_arkship_archaeo_missile_battery_desc: "具有骇人精度的古代制导弹药，从考古遗址中回收并重新投入使用。"
 sm_br_arkship_archaeo_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_MISSILE$§!。\n"
 sm_br_arkship_swamer_missile_battery: "$SWARMER_MISSILE_1$"
 sm_br_arkship_swamer_missile_battery_desc: "发射器装填了蜂群弹药，以绝对的数量优势压倒了点防御。"
 sm_br_arkship_swamer_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y蜂群导弹发射器§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_scourge_missile_battery: "$SCOURGE_MISSILE_1$"
 sm_br_arkship_scourge_missile_battery_desc: "经过改造的生化弹头，掌握在那些愿意用虫群天灾自己的武器反制天灾本身的人手中。"
 sm_br_arkship_scourge_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些专用的炮塔将会装有§Y$SCOURGE_MISSILE_1$§!。\n"
 sm_br_arkship_flak_battery: "$FLAK_BATTERY_1$"
 sm_br_arkship_flak_battery_desc: "专门针对来袭的舰载机和导弹，在它们触及舰体前将其粉碎的点防御集群。"
 sm_br_arkship_flak_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些炮塔将会装有§Y高射炮§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_pd_battery: "点防御炮台"
 sm_br_arkship_pd_battery_desc: "覆盖舰体的密集近防武器系统网络，能够在来袭的威胁到达舰船之前对其进行追踪与拦截。"
 sm_br_arkship_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些炮塔将会装有§Y点防御炮台§!并自动升级到我们最新的科技水平。\n"
 sm_br_arkship_archaeo_pd_battery: "$ARCHAEO_POINTDEFENCE$"
 sm_br_arkship_archaeo_pd_battery_desc: "来源不明的古老点防御阵列，依然如上次开火那天般有效。"
 sm_br_arkship_archaeo_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_POINTDEFENCE$§!。\n"
 sm_br_arkship_spinal_devastator_mount: "毁灭者挂载"
 sm_br_arkship_spinal_devastator_mount_desc: "它的电力需求如此巨大，以至于仅一次发射就让数百万家庭陷入数小时的黑暗。下达开火的决议从来不是一件轻松事。"
 sm_br_arkship_spinal_devastator_mount_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$该轴基挂载装配了§Y$ARKSHIP_DEVASTATOR_WEAPON$§!。"
 sm_br_arkship_capital_shipyard: "主力舰船坞"
 sm_br_arkship_capital_shipyard_desc: "这些船厂坐落在方舟飞船的核心地带，让我们在穿越繁星的同时，建造规模空前的舰船。"
 sm_br_arkship_capital_shipyard_tt: "船坞：§Y允许建造主力舰§!"
 sm_br_arkship_planetary_refinery: "行星再处理器"
 sm_br_arkship_planetary_refinery_desc: "较小的天体可以在这些巨大的齿轮中被粉碎和加工，为我们提供丰富的材料。"
 sm_br_arkship_planetary_refinery_tt: "$sm_arkship_mining_array_tt$$TABBED_NEW_LINE$['scripted_action:br_arkship_reprocess_planet']"
 sm_br_arkship_stellar_igniter: "恒星引擎"
 sm_br_arkship_stellar_igniter_desc: "一个能够触发恒星级聚变事件的暗物质注入系统。这玩意可没有安全保险。"
 sm_br_arkship_stellar_igniter_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:br_arkship_stellar_ignition']"
 sm_br_arkship_system_scanner: "亚空间成像阵列"
 sm_br_arkship_system_scanner_desc: "虚空在低语，对于那些懂得聆听的人，它正呢喃着其怀抱中无数世界的秘密。"
 sm_br_arkship_system_scanner_tt: "$sm_arkship_sensor_array_tt$$TABBED_NEW_LINE$['scripted_action:br_arkship_subspace_image']"
 sm_br_arkship_exodus_jump: "大迁徙跃迁协调仪"
 sm_br_arkship_exodus_jump_desc: "大迁徙跃迁协调仪目前在很大程度上仍是一个原型，在未来的某一天，它将使我们能够在眨眼之间穿越到不同的星系。"
 sm_br_arkship_exodus_jump_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:br_arkship_exodus_jump']"
 sm_br_arkship_armor: "装甲覆层"
 sm_br_arkship_armor_desc: "厚重的装甲板用螺栓固定在方舟舰最暴露的部位。这些重量对各个系统提出了更高的要求，但方舟舰承受住了。"
 sm_br_arkship_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些通用槽位将会装有§Y装甲§!并自动升级到我们最新的科技水平。"
 sm_br_arkship_lm_armor: "再生$sm_arkship_armor$"
 sm_br_arkship_lm_armor_desc: "活体金属穿梭于舰体装甲之中，在缺口出现的瞬间便将其封闭。"
 sm_br_arkship_lm_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_LM_ARMOR_1$§!并自动升级到我们最新的科技水平。"
 sm_br_arkship_archaeo_armor: "$tech_archaeoarmor$"
 sm_br_arkship_archaeo_armor_desc: "挖掘出的未知合金成分制造的舰壳板。无论是什么文明建造了这些飞船，都没打算让它们轻易被摧毁。"
 sm_br_arkship_archaeo_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_ARCHAEO_ARMOR$§!。"
 sm_br_arkship_shield: "护盾阵列"
 sm_br_arkship_shield_desc: "遍布舰体的发射器阵列投射出重叠的护盾力场，吸收敌人向我们倾泻的最猛烈的火力。"
 sm_br_arkship_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y护盾§!并自动升级到我们最新的科技水平。"
 sm_br_arkship_psi_shield: "$tech_psionic_shield$"
 sm_br_arkship_psi_shield_desc: "灵能护盾触及了常规偏导护盾无法触碰的现实层面。本该命中的冲击，却落空了。"
 sm_br_arkship_psi_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_PSI_SHIELD$§!。"
 sm_br_arkship_archaeo_shield: "$tech_archaeoshield$"
 sm_br_arkship_archaeo_shield_desc: "打捞回收的未知设计的护盾发生器，比现代工程学制造的任何设备都要高效。"
 sm_br_arkship_archaeo_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_ARCHAEO_SHIELD$§!。"
 sm_br_arkship_crystal_plating: "$tech_crystal_armor_1$"
 sm_br_arkship_crystal_plating_desc: "致密的晶体复合面板附着在外部船体上，可针对所有形式的来袭伤害提供强大的防护。"
 sm_br_arkship_crystal_plating_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y晶体覆层§!并自动升级到我们最新的科技水平。"
 sm_br_arkship_afterburner: "$tech_afterburners_1$"
 sm_br_arkship_afterburner_desc: "当常规推进器不足时，用于拉近距离或脱离交战的紧急推力系统。"
 sm_br_arkship_afterburner_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备§Y$tech_afterburners_1$§!，并会自动升级至我们的最新技术。"
 sm_br_arkship_armor_hardener: "$tech_armor_hardeners_1$"
 sm_br_arkship_armor_hardener_desc: "能够在撞击前的瞬间选择性硬化船体的反应装甲。"
 sm_br_arkship_armor_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备§Y$tech_armor_hardeners_1$§!，并会自动升级至我们的最新技术。"
 sm_br_arkship_shield_hardener: "$tech_shield_hardeners_1$"
 sm_br_arkship_shield_hardener_desc: "能够在战斗中切换护盾谐波的频率调制器，可降低那些旨在绕过护盾的武器所造成的穿透力。"
 sm_br_arkship_shield_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备 §Y$tech_shield_hardeners_1$§!，并自动升级至我们的最新技术。"
 sm_br_arkship_quantum_destabilizer: "$SHIP_AURA_QUANTUM_DESTABILIZER$"
 sm_br_arkship_quantum_destabilizer_desc: "方舟舰的质量使其能够投射出力场，干扰附近敌舰的武器系统，从而降低其射速。"
 sm_br_arkship_subspace_snare: "$SHIP_AURA_SUBSPACE_SNARE$"
 sm_br_arkship_subspace_snare_desc: "由方舟舰投射的子空间锚定场，可阻止敌方舰船通过超光速手段逃脱。"
 sm_br_arkship_shield_dampener: "$SHIP_AURA_SHIELD_DAMPENER$"
 sm_br_arkship_shield_dampener_desc: "安装在舰体各处的干扰发射器会压制附近敌舰的护盾，限制其最大防护能力。"
 sm_br_arkship_aura_strike_craft: "$SHIP_AURA_STRIKE_CRAFT$"
 sm_br_arkship_aura_strike_craft_desc: "方舟舰广播飞行协调信号，提升附近友方舰载机的战斗力。"
 sm_br_arkship_aura_hyperlane: "$SHIP_AURA_HYPERLANE$"
 sm_br_arkship_aura_hyperlane_desc: "方舟舰投射的导航信标改进了舰队中所有舰船的超空间引擎计算。"
 sm_br_arkship_aura_pd_penetration: "$SHIP_AURA_PD_PENETRATION$"
 sm_br_arkship_aura_pd_penetration_desc: "方舟舰发出的电子反制广播扰乱了敌方的点防御瞄准，使我方武器得以突破拦截。"
 sm_br_arkship_aura_bombardment: "$SHIP_AURA_BOMBARDMENT$"
 sm_br_arkship_aura_bombardment_desc: "由方舟舰部署的火控中继提升了整个舰队的轨道轰炸精度。"
 sm_br_arkship_aura_range: "$SHIP_AURA_RANGE$"
 sm_br_arkship_aura_range_desc: "方舟舰阵列共享的瞄准数据扩大了舰队中每艘舰船的有效交战距离。"
 sm_br_arkship_energy_hub: "超导线圈"
 sm_br_arkship_energy_hub_desc: "超导电缆网格贯穿船体，消除了电阻损耗，并最大化了向各个系统的电力输送。"
 sm_br_arkship_food_hub: "气候优化控制站"
 sm_br_arkship_food_hub_desc: "将每一个种植舱和水培甲板推至运行极限的环境控制系统。"
 sm_br_arkship_hydroponics_bay: "扩建栽培甲板"
 sm_br_arkship_hydroponics_bay_desc: "船体的部分区段被改造用于大规模水培种植。"
 sm_br_arkship_harvest_processing_arrays: "采集品处理阵列"
 sm_br_arkship_harvest_processing_arrays_desc: "专用处理阵列与舱外活动整备设施，显著增强了方舟船在轨道沉积物收集与提炼方面的作业能力。"
 sm_br_arkship_trade_hub: "外部后勤系统"
 sm_br_arkship_trade_hub_desc: "外部舰体上的货运轨道与磁力对接系统优化了方舟舰与合作舰船之间的资源传输。"
 sm_br_arkship_bureaucracy_hub: "行政协调中心"
 sm_br_arkship_bureaucracy_hub_desc: "行政处理中心分布在多个甲板上，让我们的治理运作如同引擎般顺畅。"
 sm_br_arkship_synapse_hub: "突触中继器"
 sm_br_arkship_synapse_hub_desc: "加速方舟舰上共享意识决策的神经中继集群。"
 sm_br_arkship_maintenance_hub: "维护中枢"
 sm_br_arkship_maintenance_hub_desc: "专用维修舱确保每个部件在出现问题之前都能得到监控、维护和更换。在太空中，小故障与灾难之间只有一线之隔。"
 sm_br_arkship_consumer_goods_hub: "产业装配线"
 sm_br_arkship_consumer_goods_hub_desc: "装配线被重新用于消费品生产，在满足民众基本需求的同时，提供他们想要的商品。"
 sm_br_arkship_alloys_hub: "高能熔炉"
 sm_br_arkship_alloys_hub_desc: "合金熔炼设施的运行已达到船体所能安全承受的极限。"
 sm_br_arkship_psi_corps: "灵能军团"
 sm_br_arkship_psi_corps_desc: "这座设施深藏于方舟飞船的船体深处，与人口聚居的环形区域相隔绝，专门用于训练具有灵能天赋的个体，使灵能军团得以对全体居民保持密切监视。\n\n§Y灵能军团是你的朋友。信任军团。§!\n\n£job_telepath£ $job_telepath_plural$可产出£unity£ §Y$unity$§!，降低 £crime£ §Y$PLANET_CRIME_TITLE$§!，并提升$mod_psionic_pop_bonus_workforce_mult$。\n"
 sm_br_arkship_psi_corps_hive_mind: "$sm_arkship_psi_corps$"
 sm_br_arkship_psi_corps_desc_hive_mind: "这座设施位于方舟飞船深处，远离人口稠密的环带，专门用于训练有心灵异能天赋的工蜂，并让这批灵能军团监视蜂群。\n\n§Y这批灵能军团能够保护你，相信它们。§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_br_arkship_psi_corps_machine_intelligence: "$sm_arkship_psi_corps$"
 sm_br_arkship_psi_corps_desc_machine_intelligence: "这座设施位于方舟飞船深处，远离人口稠密的环带，专门用于训练有灵能天赋的单位，并让这批灵能军团巡检无人机群。\n\n§Y这批灵能军团能够保护你，相信它们。§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_br_arkship_shield_generator: "护盾增幅器"
 sm_br_arkship_shield_generator_desc: "强化主护盾网的次级发射器阵列，为船体增加了另一层保护。"
 sm_br_arkship_galactic_stock_exchange: "证券交易所"
 sm_br_arkship_galactic_stock_exchange_desc: "一个全天候运作的交易大厅，将我们的市场与我们途经的每一个帝国的市场连接起来。"
 sm_br_arkship_embassy_complex: "使馆综合体"
 sm_br_arkship_embassy_complex_desc: "接待来自星系各地使节的外交套房与接待大厅。好客之道，四海皆通。"
 sm_br_arkship_noble_estates: "贵族庄园"
 sm_br_arkship_noble_estates_desc: "专为贵族保留的镀金居住区，其财富与权势随船同行。"
 sm_br_arkship_slave_processing_facility: "轨道奴隶处理中心"
 sm_br_arkship_slave_processing_facility_desc: "用于管理奴隶人口的处理设施，确保在我们访问的每一个星系中都能保持高效的劳动力分配。"
