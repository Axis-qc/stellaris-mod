 sm_br_arkship_mining_hub_effect_desc: "根据当前星系中天体数量提供矿工岗位。"
 # 采矿科技
 tech_br_mining_mastery:0 "深空矿物精炼"
 tech_br_mining_mastery_desc: "通过先进的远程精炼技术，大幅提升在深空中提取和处理矿物资源的效率。无人机矿工的产出与岗位数量进一步提升。"
