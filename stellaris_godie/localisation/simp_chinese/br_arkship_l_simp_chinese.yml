 # 采矿建筑
 building_br_ark_mining_hub:0 "深空采矿枢纽"
 building_br_ark_mining_hub_desc:0 "部署回收无人机群，扫描并提取所在星系各天体的可用矿物资源。\n当前星系天体数量：§Y[Root.br_ark_mining_planet_mult]§!。"
