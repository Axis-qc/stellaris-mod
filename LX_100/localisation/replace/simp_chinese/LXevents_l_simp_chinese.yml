 lxleader100.title: "§H是否启用双命定§!"
 lxleader100.desc: "当领袖达到20级时可以通过事件再次选择添加一个命定特质。\n每年可以触发一次选择第二个命定的事件，前提是你有达到20级的领袖。"
 lxleader100.1: "§G是的，启用§!"
 lxleader100.2: "§R不用，关闭§!"

